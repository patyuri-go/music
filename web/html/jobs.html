<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan Jobs</title>
  <link href="/web/css/jobs.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>Scan Jobs</h1>
      <div id="header-actions">
        <span id="live-dot" class="live"></span>
        <label id="interval-label">refresh
          <select id="interval">
            <option value="500">0.5s</option>
            <option value="1000" selected>1s</option>
            <option value="2000">2s</option>
            <option value="5000">5s</option>
            <option value="10000">10s</option>
          </select>
        </label>
        <label id="finished-label"><input type="checkbox" id="show-finished"> show finished</label>
        <a id="library-link" href="/web/html/library.html">Library</a>
        <a id="editor-link" href="/web/html/root.html">File Editor</a>
        <button id="refresh-btn">Refresh</button>
      </div>
    </header>

    <div id="summary">
      <span id="summary-text">Loading…</span>
    </div>

    <div id="jobs"></div>
  </div>

  <script src="/web/js/jobs.js"></script>
</body>
</html>
