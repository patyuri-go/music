<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Library (Database)</title>
  <link href="/web/css/library.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <header id="header">
      <h1>Music Library</h1>
      <div id="header-actions">
        <label class="opt">
          <input type="checkbox" id="auto-fetch">
          Auto fetch
        </label>
        <label class="opt">
          Page size
          <input type="number" id="page-size" value="10" min="1" max="200" step="1">
        </label>
        <button id="next-page">Next page</button>
        <button id="refresh-btn">Refresh</button>
      </div>
    </header>

    <div id="main">
      <!-- 左侧两棵独立的全量树：各有自己的来源库选择器和搜索框。 -->
      <div id="sidebar">
        <section class="pane" data-pane="a">
          <div class="pane-source">
            <select id="source-a" title="Source library"></select>
          </div>
          <div class="pane-search">
            <input type="text" id="search-a" placeholder="Search artists, albums, songs…" autocomplete="off">
            <select id="type-a" title="Search type">
              <option value="album">Album</option>
              <option value="artist">Artist</option>
              <option value="track">Track</option>
            </select>
          </div>
          <ul class="pane-tree" id="tree-a"></ul>
          <div class="pane-status" id="status-a"></div>
        </section>

        <section class="pane" data-pane="b">
          <div class="pane-source">
            <select id="source-b" title="Source library"></select>
          </div>
          <div class="pane-search">
            <input type="text" id="search-b" placeholder="Search artists, albums, songs…" autocomplete="off">
            <select id="type-b" title="Search type">
              <option value="album">Album</option>
              <option value="artist">Artist</option>
              <option value="track">Track</option>
            </select>
          </div>
          <ul class="pane-tree" id="tree-b"></ul>
          <div class="pane-status" id="status-b"></div>
        </section>
      </div>

      <div id="content">
        <div id="no-selection" class="placeholder">
          Select an artist, album or track (search first)
        </div>
        <div id="detail" class="hidden"></div>
      </div>
    </div>
  </div>

  <!-- 左树多选后从右下方弹出；固定占屏幕右半边，不遮挡左侧树。 -->
  <div id="link-panel" aria-hidden="true">
    <div class="link-panel-head">
      <strong id="link-selected-count">已选 0 项</strong>
      <button id="link-clear" type="button" title="Clear selection">×</button>
    </div>
    <div class="link-panel-controls">
      <label class="link-field">
        目标媒体库
        <select id="link-target"></select>
      </label>
      <label class="link-check">
        <input type="checkbox" id="link-auto-fetch">
        Auto fetch
      </label>
      <button id="link-start" type="button">开始匹配</button>
    </div>
    <div id="link-log" class="link-log"></div>
  </div>

  <script src="/web/js/library.js"></script>
  <script src="/web/js/link-select.js"></script>
  <script src="/web/js/link-match.js"></script>
</body>
</html>
